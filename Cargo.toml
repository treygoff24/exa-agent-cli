[package]
name = "exa-agent-cli"
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
description = "Agent-first CLI over the full Exa API surface (single static binary)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/treygoff24/exa-agent-cli"
# dist warns without this: the generated Homebrew formula has a `homepage` field to fill.
homepage = "https://github.com/treygoff24/exa-agent-cli"
readme = "README.md"
keywords = ["exa", "cli", "agent", "search", "ai"]
categories = ["command-line-utilities"]
# build.rs regenerates the registry from these committed inputs, so they are real
# package inputs — a missing overlay.toml makes a published build fail (plan → publish checklist).
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/openapi/exa-openapi.json",
    "/openapi/team-management.json",
    "/openapi/overlay.toml",
    "/openapi/provenance.toml",
    "/README.md",
    "/LICENSE-*",
]

[[bin]]
name = "exa-agent"
path = "src/main.rs"

[lib]
name = "exa_agent_cli"
path = "src/lib.rs"

[features]
default = ["keyring"]
# Reserved feature names; neither enables an OS keyring today. Authentication
# uses environment keys or a plaintext 0600 credentials file on every platform.
keyring = []
# dist builds every target with default features. A future keyring must account
# for target_env = "musl" rather than relying on per-target feature selection.
musl-set = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Keep the lockfile below the 1.85 MSRV; newer 0.3 releases require Rust 1.88.
time = { version = "=0.3.45", features = ["parsing"] }
toml = "0.8"
toml_edit = "0.22"
# gzip: flate2 with its default pure-Rust `rust_backend` (miniz_oxide) — no zlib C shim, so musl
# static linking stays clean (D14). default-features stays false to keep the dep tree minimal.
ureq = { version = "3", default-features = false, features = ["gzip", "json", "rustls"] }
sha2 = "0.10"
ctrlc = "3"

# Unix-only: safe wrappers over the syscalls the state layer needs (flock-style locking, O_NOFOLLOW
# opens, fchmod on a held fd). rust-version 1.63, well under our 1.85 MSRV, and already in the tree
# transitively, so this adds no new third-party code to audit.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
anyhow = "1"

[dev-dependencies]
rustix = { version = "1.1.4", features = ["net"] }
flate2 = "1"

[workspace]
members = ["xtask"]

[profile.release]
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
lto = "thin"

# Smaller dev/test artifacts, not a measured build-speed improvement. Project
# frames retain file/line information; dependency frames lose line numbers.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
