# Machine-checked vendoring record — the single source of truth for what was vendored.
# `cargo run -p xtask -- vendor-spec --check` and `tests/openapi_parity.rs` assert
# `vendored_sha256` and `operations` against the committed files, so this file cannot go
# stale silently. PROVENANCE.md narrates it and deliberately keeps no second copy.
#
# `source_sha256` records the upstream bytes the vendored file came from. It is provenance
# only: nothing offline can re-verify it, and re-fetching may legitimately change it.

