# cargo-dist setup steps, not a standalone workflow. Regenerate release.yml after edits.
# ring/cc expects aarch64-linux-musl-gcc; distro musl-tools supplies musl-gcc on
# arm64. Setup runs before dist dependency installation, so install then probe.
- name: Point cc at musl-gcc for aarch64 musl
  if: ${{ contains(join(matrix.targets, ','), 'aarch64-unknown-linux-musl') }}
  shell: bash
  run: |
    set -euo pipefail
    sudo apt-get update
    sudo apt-get install -y musl-tools
    if command -v aarch64-linux-musl-gcc >/dev/null 2>&1; then
      echo "aarch64-linux-musl-gcc is on PATH; leaving cc defaults alone"
      exit 0
    fi
    if ! command -v musl-gcc >/dev/null 2>&1; then
      echo "musl-tools installed but neither aarch64-linux-musl-gcc nor musl-gcc is on PATH" >&2
      exit 1
    fi
    echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
    echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
